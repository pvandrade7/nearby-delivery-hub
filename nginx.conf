server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Compressão ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Security headers (aplicados em todas as respostas) ──
    # Impede clickjacking
    add_header X-Frame-Options            "DENY"                                                                  always;
    # Impede MIME sniffing
    add_header X-Content-Type-Options     "nosniff"                                                               always;
    # Informações de referrer controladas
    add_header Referrer-Policy            "strict-origin-when-cross-origin"                                       always;
    # XSS filter legado (browsers antigos)
    add_header X-XSS-Protection           "1; mode=block"                                                         always;
    # HSTS: força HTTPS por 1 ano (habilitar apenas após obter certificado TLS)
    # add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains; preload"  always;
    # Permissions Policy: desabilita APIs desnecessárias
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), payment=(self)"              always;
    # Content Security Policy
    # - script-src 'self': sem eval ou inline scripts no bundle de produção do Vite
    # - style-src 'unsafe-inline': necessário para Radix UI / Tailwind / Recharts (inline styles)
    # - img-src: Supabase Storage, Unsplash (produtos), Wikimedia (logos de lojas no mockData)
    # - connect-src: Supabase REST + Realtime (wss)
    # - frame-ancestors 'none': reforça anti-clickjacking independente do X-Frame-Options
    add_header Content-Security-Policy
        "default-src 'self'; \
         script-src 'self'; \
         style-src 'self' 'unsafe-inline'; \
         img-src 'self' data: blob: \
           https://*.supabase.co \
           https://images.unsplash.com \
           https://upload.wikimedia.org \
           https://logospng.org \
           https://*.githubusercontent.com; \
         connect-src 'self' \
           https://*.supabase.co \
           wss://*.supabase.co \
           https://brasilapi.com.br; \
         font-src 'self' data:; \
         object-src 'none'; \
         base-uri 'self'; \
         form-action 'self'; \
         frame-ancestors 'none';"
        always;

    # ── Cache longo para assets com hash (JS/CSS do Vite) ──
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA: rotas desconhecidas → index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
